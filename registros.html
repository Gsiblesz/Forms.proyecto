<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registros — Entradas</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <style>
    .viewer {
      max-width: 100%;
      margin: 24px auto;
      padding: 16px;
      background: #0b0b0c;
      color: #e6e6e6;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .viewer h1 {
      margin-top: 0;
      font-size: 1.5rem;
      text-align: center;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .toolbar label {
      flex: 1;
      min-width: 150px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      border-bottom: 1px solid #222;
      padding: 8px 10px;
      text-align: left;
    }
    tr.sin-solicitud td { color: #ffb3b3; }
    tr.sin-solicitud td:first-child { position: relative; }
    tr.sin-solicitud td:first-child::before {
      content: '●';
      color: #ff6b6b;
      margin-right: 6px;
    }
    th {
      background: #121214;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .muted {
      color: #9aa0a6;
      font-size: 0.8rem;
    }
    .status {
      margin: 8px 0 16px;
      font-size: 0.9rem;
    }
    .pill {
      padding: 2px 8px;
      border-radius: 999px;
      background: #1f4337;
      color: #79ffa7;
      font-size: 0.8rem;
    }
    .error {
      background: #4a1f1f;
      color: #ffb3b3;
    }
    tr.diff td { background: rgba(255,107,107,0.08); }
    @media (max-width: 768px) {
      .viewer {
        padding: 12px;
      }
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      table {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="brand" style="position:fixed; top:12px; left:16px; display:flex; gap:12px; align-items:center; z-index:10;">
    <img src="./assets/brand.png" alt="PAN DE TATA" onerror="this.src='./assets/brand.svg'" style="height:44px;width:auto;border-radius:6px;box-shadow:0 0 0 2px #000;background:#000" />
  </div>
  <div class="viewer" style="margin-top:80px">
    <h1>Registros de Entradas</h1>
    <div class="toolbar">
      <label>Mostrar últimos
        <select id="limit">
          <option>25</option>
          <option selected>100</option>
          <option>200</option>
          <option>500</option>
        </select>
      </label>
      <label><input type="checkbox" id="only-sin" /> Solo sin solicitud</label>
      <button id="refresh">Actualizar</button>
      <a href="./menu.html" style="margin-left:auto">← Volver al menú</a>
    </div>
    <div id="status" class="status muted">Listo.</div>
    <div style="overflow:auto; max-height:70vh; border:1px solid #222; border-radius:8px;">
      <table id="tbl">
        <thead>
          <tr id="thead-row"></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="muted">Fuente: /api/gs-proxy → Apps Script doGet (con token). Puedes pasar ?sheet=NombreDePestaña en la URL.</p>
  </div>

  <script>
    function getQuery(key) {
      const u = new URL(window.location.href);
      return u.searchParams.get(key);
    }

    async function fetchEntries(limit) {
      const qp = new URLSearchParams({ limit: String(limit) });
      const urlOverride = getQuery('url');
      const tokenOverride = getQuery('token');
      const sheet = getQuery('sheet');
      const ssid = getQuery('ssid');
      const ssurl = getQuery('ssurl');
      const formId = getQuery('formId');
      if (urlOverride) {
        qp.set('url', urlOverride);
      } else {
        // fallback: usa la URL guardada en ajustes locales si existe
        try {
          const s = JSON.parse(localStorage.getItem('gs_settings') || '{}');
          if (s.url) qp.set('url', s.url);
          if (s.token && !tokenOverride) qp.set('token', s.token);
        } catch {}
      }
      if (tokenOverride) qp.set('token', tokenOverride);
      if (sheet) qp.set('sheet', sheet);
      if (ssid) qp.set('ssid', ssid);
      if (ssurl) qp.set('ssurl', ssurl);
  if (formId) qp.set('formId', formId);
      const url = `/api/gs-proxy?${qp.toString()}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data || data.ok === false) throw new Error(data?.error || 'Error remoto');
      // data.head: arreglo de nombres de columnas (si el backend lo provee)
      // data.rows: array de objetos o array de arrays
      return { head: data.head || null, rows: (data.rows || data.data || []) };
    }

    function renderPayload(payload) {
      const HEAD_FALLBACK = ["entry_id","timestamp","fecha","code","product","quantity","sede","tipo","familia","responsable","form"]; // por defecto
      const head = Array.isArray(payload.head) && payload.head.length ? payload.head : HEAD_FALLBACK;
      const rows = Array.isArray(payload.rows) ? payload.rows : [];

      // construir encabezado
      const theadRow = document.getElementById('thead-row');
      theadRow.innerHTML = '';
      head.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        theadRow.appendChild(th);
      });

      const tb = document.querySelector('#tbl tbody');
      tb.innerHTML = '';
      const up = s => String(s||'').trim().toUpperCase();
      const iSin = head.findIndex(h => up(h) === 'SIN_SOLICITUD');
      const iSol = head.findIndex(h => up(h) === 'SOLICITUD_ID');
      const iCS = head.findIndex(h => up(h) === 'CANTIDAD SOLICITADA');
      const iCE = head.findIndex(h => up(h) === 'CANTIDAD ENTREGADA');
      const iC  = head.findIndex(h => up(h) === 'CANTIDAD');
      const rowsRev = rows.slice().reverse(); // más recientes primero
      const onlySin = document.getElementById('only-sin')?.checked;
      let sumCS = 0, sumCE = 0, sumC = 0, countSin = 0, shown = 0;
      for (const r of rowsRev) {
        // Si es objeto y tenemos head, pintamos en el orden de head; si es array, lo usamos directo
        const arr = Array.isArray(r) ? r : head.map(h => r[h]);
        const tr = document.createElement('tr');
        // Detectar fila "sin solicitud"
        let isSin = false;
        if (iSin >= 0 && iSin < arr.length) {
          const v = up(arr[iSin]);
          isSin = (v === 'SI' || v === 'TRUE' || v === '1');
        } else if (iSol >= 0 && iSol < arr.length) {
          const v = up(arr[iSol]);
          isSin = v.indexOf('SIN-SOL') === 0;
        }
        if (onlySin && !isSin) continue;
        if (isSin) tr.classList.add('sin-solicitud');
        const cs = (iCS >= 0 && iCS < arr.length) ? Number(arr[iCS] || 0) : 0;
        const ce = (iCE >= 0 && iCE < arr.length) ? Number(arr[iCE] || 0) : 0;
        const c  = (iC  >= 0 && iC  < arr.length) ? Number(arr[iC]  || 0) : 0;
        if ((cs || ce) && cs !== ce) tr.classList.add('diff');
        sumCS += (isFinite(cs) ? cs : 0);
        sumCE += (isFinite(ce) ? ce : 0);
        sumC  += (isFinite(c)  ? c  : 0);
        if (isSin) countSin += 1;
        // número de columnas según head
        arr.slice(0, head.length).forEach(v => {
          const td = document.createElement('td');
          td.textContent = v == null ? '' : String(v);
          tr.appendChild(td);
        });
        tb.appendChild(tr);
        shown++;
      }
      return { shown, sumCS, sumCE, sumC, countSin, hasC: iC >= 0, hasCS: iCS >= 0, hasCE: iCE >= 0 };
    }

    async function load() {
      const limitSel = document.getElementById('limit');
      const status = document.getElementById('status');
      try {
        status.textContent = 'Cargando…';
      const payload = await fetchEntries(Number(limitSel.value));
        const sum = renderPayload(payload);
        const usingOverride = !!getQuery('url');
      const hint = usingOverride ? ' (URL por query)' : '';
    const usedUrl = getQuery('url') || (JSON.parse(localStorage.getItem('gs_settings')||'{}').url ? 'local:gs_settings.url' : 'env:GS_WEBAPP_URL');
      const sheet = getQuery('sheet');
      const sheetHint = sheet ? ` — sheet: ${sheet}` : '';
      const ssid = getQuery('ssid');
      const fileHint = ssid ? ` — ssid: ${ssid}` : '';
      const n = sum?.shown ?? (Array.isArray(payload.rows) ? payload.rows.length : 0);
        const totals = sum?.hasC
          ? `Cantidad total: <strong>${sum?.sumC ?? 0}</strong>`
          : `Solicitada: <strong>${sum?.sumCS ?? 0}</strong> — Entregada: <strong>${sum?.sumCE ?? 0}</strong>`;
        status.innerHTML = `<span class=\"pill\">OK</span> ${n} fila(s) — ${totals} — Sin solicitud: <strong>${sum?.countSin ?? 0}</strong>${hint}${sheetHint}${fileHint} <span class=\"muted\">Origen: ${usedUrl}</span>`;
      } catch (err) {
        console.error(err);
        status.innerHTML = `<span class="pill error">Error</span> ${String(err)}`;
      }
    }

  document.getElementById('refresh').addEventListener('click', load);
  document.getElementById('only-sin').addEventListener('change', load);
    load();
  </script>
</body>
</html>
