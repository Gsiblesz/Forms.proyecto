<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registros — Entradas</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <style>
    .viewer { max-width: 1100px; margin: 24px auto; padding: 16px; background:#0b0b0c; color:#e6e6e6; border-radius: 12px; }
    .viewer h1 { margin-top: 0; }
    .toolbar { display:flex; gap:12px; align-items:center; margin-bottom:12px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #222; padding: 8px 10px; text-align: left; }
    th { background: #121214; position: sticky; top: 0; }
    .muted { color:#9aa0a6; font-size: 12px; }
    .status { margin: 8px 0 16px; }
    .pill { padding:2px 8px; border-radius:999px; background:#1f4337; color:#79ffa7; font-size: 12px; }
    .error { background:#4a1f1f; color:#ffb3b3; }
  </style>
</head>
<body>
  <div class="brand" style="position:fixed; top:12px; left:16px; display:flex; gap:12px; align-items:center; z-index:10;">
    <img src="./assets/brand.png" alt="PAN DE TATA" onerror="this.src='./assets/brand.svg'" style="height:44px;width:auto;border-radius:6px;box-shadow:0 0 0 2px #000;background:#000" />
  </div>
  <div class="viewer" style="margin-top:80px">
    <h1>Registros de Entradas</h1>
    <div class="toolbar">
      <label>Mostrar últimos
        <select id="limit">
          <option>25</option>
          <option selected>100</option>
          <option>200</option>
          <option>500</option>
        </select>
      </label>
  <button id="refresh">Actualizar</button>
  <a href="./menu.html" style="margin-left:auto">← Volver al menú</a>
    </div>
    <div id="status" class="status muted">Listo.</div>
    <div style="overflow:auto; max-height:70vh; border:1px solid #222; border-radius:8px;">
      <table id="tbl">
        <thead>
          <tr>
            <th>entry_id</th>
            <th>timestamp</th>
            <th>fecha</th>
            <th>code</th>
            <th>product</th>
            <th>quantity</th>
            <th>sede</th>
            <th>tipo</th>
            <th>familia</th>
            <th>responsable</th>
            <th>form</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  <p class="muted">Fuente: /api/gs-proxy → Apps Script doGet (con token). Puedes pasar ?sheet=NombreDePestaña en la URL.</p>
  </div>

  <script>
    function getQuery(key) {
      const u = new URL(window.location.href);
      return u.searchParams.get(key);
    }

    async function fetchEntries(limit) {
      const qp = new URLSearchParams({ limit: String(limit) });
      const urlOverride = getQuery('url');
      const tokenOverride = getQuery('token');
      const sheet = getQuery('sheet');
      if (urlOverride) {
        qp.set('url', urlOverride);
      } else {
        // fallback: usa la URL guardada en ajustes locales si existe
        try {
          const s = JSON.parse(localStorage.getItem('gs_settings') || '{}');
          if (s.url) qp.set('url', s.url);
          if (s.token && !tokenOverride) qp.set('token', s.token);
        } catch {}
      }
      if (tokenOverride) qp.set('token', tokenOverride);
      if (sheet) qp.set('sheet', sheet);
      const url = `/api/gs-proxy?${qp.toString()}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data || data.ok === false) throw new Error(data?.error || 'Error remoto');
      // data.rows esperado: array de objetos o array de arrays
      return data.rows || data.data || [];
    }

    function render(rows) {
      const tb = document.querySelector('#tbl tbody');
      tb.innerHTML = '';
      for (const r of rows) {
        // soportar objetos o arrays en orden: entry_id, timestamp, fecha, code, product, quantity, sede, tipo, familia, responsable, form
        const arr = Array.isArray(r)
          ? r
          : [
              r.entry_id,
              r.timestamp,
              r.fecha,
              r.code,
              r.product,
              r.quantity,
              r.sede,
              r.tipo,
              r.familia,
              r.responsable,
              r.form,
            ];
        const tr = document.createElement('tr');
        arr.slice(0,11).forEach(v => {
          const td = document.createElement('td');
          td.textContent = v == null ? '' : String(v);
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      }
    }

    async function load() {
      const limitSel = document.getElementById('limit');
      const status = document.getElementById('status');
      try {
        status.textContent = 'Cargando…';
      const rows = await fetchEntries(Number(limitSel.value));
        render(rows);
      const usingOverride = !!getQuery('url');
      const hint = usingOverride ? ' (URL por query)' : '';
  const usedUrl = getQuery('url') || (JSON.parse(localStorage.getItem('gs_settings')||'{}').url ? 'local:gs_settings.url' : 'env:GS_WEBAPP_URL');
      const sheet = getQuery('sheet');
      const sheetHint = sheet ? ` — sheet: ${sheet}` : '';
      status.innerHTML = `<span class="pill">OK</span> ${rows.length} fila(s)${hint}${sheetHint} <span class="muted">Origen: ${usedUrl}</span>`;
      } catch (err) {
        console.error(err);
        status.innerHTML = `<span class="pill error">Error</span> ${String(err)}`;
      }
    }

    document.getElementById('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
