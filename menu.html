<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Selecciona un formulario</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <style>
      /* Layout más amplio y tarjetas más grandes para solo dos formularios */
      .menu { max-width: 1200px; margin: 80px auto 24px; padding: 16px; }
      .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(360px,1fr)); gap:24px; }
      .card { border:1px solid var(--border); border-radius:16px; padding:24px; background:#0f0f12; }
      .card h3 { margin:0 0 10px; font-size:22px; line-height:1.2; }
      .swatch { height:10px; border-radius:8px; margin-bottom:14px; }
      .card a { display:inline-block; margin-top:12px; padding:12px 16px; font-size:16px; }
      .brand { position:fixed; top:12px; left:16px; display:flex; gap:12px; align-items:center; z-index:10; }
      .brand img { height:44px; width:auto; border-radius:6px; box-shadow:0 0 0 2px #000; background:#000; }
      .credit { position:fixed; right:16px; bottom:12px; font-size:12px; color:#9aa0a6; }
    </style>
  </head>
  <body>
    <div class="brand">
      <img id="brand-img" src="./assets/brand.png" alt="PAN DE TATA" onerror="this.src='./assets/brand.svg'" />
    </div>
    <main class="menu">
      <h1>Elige un formulario</h1>
      <p class="muted">Cada botón abre el mismo registro pero apuntando a una pestaña distinta en Google Sheets.</p>

      <div id="auth" style="margin:16px 0; padding:12px; border:1px solid var(--border); border-radius:12px; background:#0f0f12;">
        <div id="auth-form">
          <label>Ingresa tu clave para continuar</label>
          <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap">
            <input id="pass" type="password" placeholder="Clave" style="padding:10px;border-radius:10px;border:1px solid var(--border);background:#0f1533;color:var(--text)" />
            <button id="enter" class="btn">Entrar</button>
            <small class="muted">Clave: <strong>LATATA10</strong></small>
          </div>
          <div id="auth-msg" class="muted" style="margin-top:6px"></div>
        </div>
        <div id="auth-ok" style="display:none;">
          <span class="pill">Acceso concedido</span>
          <span id="role-label" class="muted">Rol: Trabajador</span>
          <button id="logout" class="btn danger" style="margin-left:8px">Salir</button>
        </div>
      </div>
      <div id="cards" class="grid" style="display:none"></div>

      <section id="admin" style="display:none; margin-top:16px; padding:12px; border:1px solid var(--border); border-radius:12px; background:#0f0f12;">
        <h2>Panel de administración</h2>
        <div style="display:grid; gap:8px; max-width:700px">
          <label>URL del Web App (Apps Script)</label>
          <input id="gs-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:#0f1533;color:var(--text)" />
          <label>Token secreto</label>
          <input id="gs-token" type="text" placeholder="Pasantias90" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:#0f1533;color:var(--text)" />
          <label>Pestaña (sheet) para prueba</label>
          <select id="gs-sheet" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:#0f1533;color:var(--text)"></select>
          <label style="display:flex;gap:8px;align-items:center;margin-top:8px">
            <input id="gs-enabled" type="checkbox" /> Enviar a Google Sheets al guardar
          </label>
          <div style="display:flex; gap:8px; flex-wrap:wrap">
            <button id="save-settings" class="btn">Guardar ajustes</button>
            <button id="test-settings" class="btn outline">Probar conexión</button>
            <button id="reset-settings" class="btn danger">Restablecer ajustes</button>
            <button id="clear-storage" class="btn danger">Borrar registros locales</button>
          </div>
          <div id="admin-result" class="muted" style="margin-top:6px"></div>
        </div>
      </section>
    </main>
    <div class="credit">Elaborado por el pasante de producción <strong>Gerardo Siblesz</strong></div>
    <script src="./assets/forms.js"></script>
    <script>
  const ROLE_KEY = 'app_role';
  const SETTINGS_KEY = 'gs_settings';

      function renderCards(){
        const cont = document.getElementById('cards');
        cont.innerHTML = '';
        const allowed = (window.FORMS||[]).filter(f => f && ['tata-libertad','inventario-pt'].includes(f.id));
        allowed.forEach(form=>{
          const url = new URL('./index.html', location.href);
          url.searchParams.set('form', form.id);
          const a = document.createElement('div');
          a.className = 'card';
          a.innerHTML = `
            <div class="swatch" style="background:${form.color}"></div>
            <h3>${form.title}</h3>
            <a class="btn" href="${url.toString()}">Abrir</a>
          `;
          cont.appendChild(a);
        });
      }

      function showRole(role){
        const authForm = document.getElementById('auth-form');
        const authOk = document.getElementById('auth-ok');
        const cards = document.getElementById('cards');
        const roleLabel = document.getElementById('role-label');
        const admin = document.getElementById('admin');
        if (role){
          authForm.style.display = 'none';
          authOk.style.display = '';
          roleLabel.textContent = role === 'admin' ? 'Rol: Administrador' : 'Rol: Trabajador';
          cards.style.display = '';
          renderCards();
          admin.style.display = role === 'admin' ? '' : 'none';
        } else {
          authForm.style.display = '';
          authOk.style.display = 'none';
          cards.style.display = 'none';
          admin.style.display = 'none';
        }
      }

      // Login simple por clave (trabajador y admin, pero solo se muestra la clave de trabajador)
      document.getElementById('enter').addEventListener('click', ()=>{
        const p = document.getElementById('pass').value.trim();
        const msg = document.getElementById('auth-msg');
        if (p === 'LATATA10') {
          localStorage.setItem(ROLE_KEY, 'worker');
          msg.textContent = '';
          showRole('worker');
        } else if (p === 'TATADEPAN11') {
          localStorage.setItem(ROLE_KEY, 'admin');
          msg.textContent = '';
          showRole('admin');
        } else {
          msg.textContent = 'Clave incorrecta';
        }
      });

      document.getElementById('logout').addEventListener('click', ()=>{
        localStorage.removeItem(ROLE_KEY);
        showRole(null);
      });

      // Estado inicial
      showRole(localStorage.getItem(ROLE_KEY));

      // Lógica del panel admin
      const adminResult = document.getElementById('admin-result');
      const gsUrlInput = document.getElementById('gs-url');
      const gsTokenInput = document.getElementById('gs-token');
      const gsEnabledInput = document.getElementById('gs-enabled');
      const gsSheetSelect = document.getElementById('gs-sheet');
      const existing = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
      if (existing.url) gsUrlInput.value = existing.url;
      if (typeof existing.enabled === 'boolean') gsEnabledInput.checked = existing.enabled;
      if (existing.token) gsTokenInput.value = existing.token;

      // Poblar selector de sheet desde FORMS
      if (Array.isArray(window.FORMS) && window.FORMS.length && gsSheetSelect) {
        gsSheetSelect.innerHTML = '';
        const allowed = (window.FORMS||[]).filter(f => f && ['tata-libertad','inventario-pt'].includes(f.id));
        allowed.forEach((f, idx) => {
          const opt = document.createElement('option');
          opt.value = f.sheetTab;
          opt.textContent = `${f.title} — ${f.sheetTab}`;
          if (idx === 0) opt.selected = true;
          gsSheetSelect.appendChild(opt);
        });
      }

      document.getElementById('save-settings').addEventListener('click', ()=>{
        const settings = {
          url: gsUrlInput.value.trim(),
          enabled: gsEnabledInput.checked,
          token: gsTokenInput.value.trim() || undefined,
        };
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        adminResult.textContent = 'Ajustes guardados';
      });

      document.getElementById('test-settings').addEventListener('click', async ()=>{
        const url = gsUrlInput.value.trim();
        if (!url) { adminResult.textContent = 'Primero ingresa la URL'; return; }
        const token = gsTokenInput.value.trim();
        const sheet = gsSheetSelect && gsSheetSelect.value ? gsSheetSelect.value : (window.FORMS && window.FORMS[0] && window.FORMS[0].sheetTab) || '';
        const form = (window.FORMS || []).find(f => f.sheetTab === sheet) || null;
        const probe = {
          id: 'test-'+Math.random().toString(36).slice(2,6),
          at: new Date().toISOString(),
          items:[{product:'PING',quantity:1}],
          meta: { sheet, formId: form?.id || '', formName: form?.title || '' },
          ...(token?{token}:{})
        };
        try {
          const res = await fetch('/api/gs-submit', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ url, entry: probe }) });
          const json = await res.json().catch(()=>({}));
          adminResult.textContent = `HTTP ${res.status} — ${JSON.stringify(json).substring(0,200)}... (sheet: ${sheet})`;
        } catch (err) {
          adminResult.textContent = String(err);
        }
      });

      document.getElementById('reset-settings').addEventListener('click', ()=>{
        if (confirm('¿Restablecer ajustes?')) {
          localStorage.removeItem(SETTINGS_KEY);
          adminResult.textContent = 'Ajustes restablecidos';
        }
      });

      document.getElementById('clear-storage').addEventListener('click', ()=>{
        if (confirm('¿Borrar registros locales?')) {
          localStorage.removeItem('productos_registrados');
          adminResult.textContent = 'Registros locales borrados';
        }
      });
    </script>
  </body>
</html>
