<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menú — Solicitudes y Registros</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <style>
      .menu { max-width: 100%; margin: 80px auto 24px; padding: 16px; }
  .tabs { display:flex; gap:12px; flex-wrap:wrap; margin: 12px 0 18px; }
  .tab { appearance:none; border:1px solid var(--border); background:#0f1533; color:var(--text); padding:12px 18px; border-radius:999px; cursor:pointer; font-size:1rem; font-weight:600; }
  .tab.active { background: var(--accent); color:#06112a; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,140,255,0.2) inset; }
      .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:16px; }
      .card { border:1px solid var(--border); border-radius:16px; padding:16px; background:#0f0f12; min-height:180px; }
      .card h3 { margin:0 0 10px; font-size:1.2rem; line-height:1.2; }
      .card p { margin:6px 0 0; color: var(--muted); font-size: 0.9rem; }
      .swatch { height:10px; border-radius:8px; margin-bottom:14px; }
      .card a { display:inline-block; margin-top:12px; padding:8px 12px; font-size:0.9rem; }
      @media (max-width: 768px) { .card { padding:12px; } .card h3 { font-size:1rem; } }
    </style>
  </head>
  <body>
    <div class="brand" style="position:fixed; top:12px; left:16px; display:flex; gap:12px; align-items:center; z-index:10;">
      <img id="brand-img" src="./assets/brand.png" alt="PAN DE TATA" onerror="this.src='./assets/brand.svg'" style="height:44px;width:auto;border-radius:6px;box-shadow:0 0 0 2px #000;background:#000" />
    </div>
    <main class="menu" style="margin-top:80px">
      <h1>Elige una pestaña</h1>
      <div class="tabs" role="tablist" aria-label="Tipos de formularios" style="display:none">
        <button class="tab" role="tab" id="tab-solicitudes" data-tab="solicitudes" aria-controls="panel-cards">Solicitudes</button>
        <button class="tab" role="tab" id="tab-registros" data-tab="registros" aria-controls="panel-cards">Registros</button>
      </div>

      <div id="auth" style="margin:16px 0; padding:12px; border:1px solid var(--border); border-radius:12px; background:#0f0f12;">
        <div id="auth-form">
          <label>Bienvenido al menú de formularios de solicitudes y registros</label>
          <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap">
            <input id="pass" type="password" placeholder="Clave" style="padding:10px;border-radius:10px;border:1px solid var(--border);background:#0f1533;color:var(--text)" />
            <button id="enter" class="btn">Entrar</button>
            <small class="muted">Clave: <strong>LATATA10</strong></small>
          </div>
          <div id="auth-msg" class="muted" style="margin-top:6px"></div>
        </div>
        <div id="auth-ok" style="display:none;">
          <span class="pill">Acceso concedido</span>
          <span id="role-label" class="muted">Rol: Trabajador</span>
          <button id="logout" class="btn danger" style="margin-left:8px">Salir</button>
        </div>
      </div>

      <section id="panel-cards" class="grid" role="tabpanel" aria-labelledby="tab-solicitudes" style="display:none"></section>
    </main>

    <div class="credit">Elaborado por el pasante de producción <strong>Gerardo Siblesz</strong></div>

    <script src="./assets/forms.js"></script>
    <script>
  const ROLE_KEY = 'app_role';

      function getActiveTab() {
        const u = new URL(window.location.href);
        const t = (u.searchParams.get('tab') || 'solicitudes').toLowerCase();
        return (t === 'registros') ? 'registros' : 'solicitudes';
      }

      function setActiveTab(tab) {
        // marcar botón activo
        document.querySelectorAll('.tab').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === tab);
          btn.setAttribute('aria-selected', btn.dataset.tab === tab ? 'true' : 'false');
        });
        // actualizar URL sin recargar
        const u = new URL(window.location.href);
        u.searchParams.set('tab', tab);
        window.history.replaceState({}, '', u);
        // render
        renderCards(tab);
      }

      function renderCards(tab) {
        const cont = document.getElementById('panel-cards');
        if (!cont) return;
        cont.innerHTML = '';
  // Mostrar formularios por pestaña
  const targetIds = tab === 'registros' ? ['solicitudes','registros'] : ['solicitudes-pedido'];
        const forms = (window.FORMS || []).filter(f => targetIds.includes(f.id));
        forms.forEach(form => {
          const url = new URL('./index.html', location.href);
          url.searchParams.set('form', form.id);
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="swatch" style="background:${form.color}"></div>
            <h3>${form.title}</h3>
            ${form.description ? `<p>${form.description}</p>` : ''}
            <a class="btn" href="${url.toString()}">Abrir</a>
          `;
          cont.appendChild(card);
        });
      }

      function showRole(role) {
        const authForm = document.getElementById('auth-form');
        const authOk = document.getElementById('auth-ok');
        const cards = document.getElementById('panel-cards');
        const roleLabel = document.getElementById('role-label');
        const tabs = document.querySelector('.tabs');
        if (role) {
          authForm.style.display = 'none';
          authOk.style.display = '';
          roleLabel.textContent = role === 'admin' ? 'Rol: Administrador' : 'Rol: Trabajador';
          cards.style.display = '';
          if (tabs) tabs.style.display = '';
          setActiveTab(getActiveTab());
        } else {
          authForm.style.display = '';
          authOk.style.display = 'none';
          cards.style.display = 'none';
          if (tabs) tabs.style.display = 'none';
        }
      }

      // Eventos de auth
      document.addEventListener('DOMContentLoaded', () => {
        const enterBtn = document.getElementById('enter');
        const logoutBtn = document.getElementById('logout');
        const msg = document.getElementById('auth-msg');
        enterBtn?.addEventListener('click', () => {
          const p = (document.getElementById('pass').value || '').trim();
          if (p === 'LATATA10') {
            localStorage.setItem(ROLE_KEY, 'worker');
            msg.textContent = '';
            showRole('worker');
          } else if (p === 'TATADEPAN11') {
            localStorage.setItem(ROLE_KEY, 'admin');
            msg.textContent = '';
            showRole('admin');
          } else {
            msg.textContent = 'Clave incorrecta';
          }
        });
        logoutBtn?.addEventListener('click', () => {
          localStorage.removeItem(ROLE_KEY);
          showRole(null);
        });

        // Tabs
        document.querySelectorAll('.tab').forEach(btn => {
          btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
        });

        // Estado inicial
        showRole(localStorage.getItem(ROLE_KEY));
        if (localStorage.getItem(ROLE_KEY)) {
          setActiveTab(getActiveTab());
        }
      });
    </script>
  </body>
</html>
